<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>DITvindue squeegee art renderer</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="foam.js"></script>
<script>
  // Timeline (seconds) — keep in sync with render-squeegee-art.js
  const W = 1080, H = 1920, FONT = '"Big Shoulders Display", sans-serif';
  const T_LETTERS = 0.7, DUR = 0.42, GAP = 0.08, HOLD_END = 6.6, PULL = 0.3, LIFT = 0.06;
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const fog = document.createElement('canvas'); fog.width = W; fog.height = H;
  const fctx = fog.getContext('2d');
  const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
  const lctx = layer.getContext('2d');
  let letters = [];
  const blade = W / 4.2;
  const cols = Math.ceil((W - blade * 0.2) / (blade * 0.85));
  const colX = i => blade * 0.5 + i * ((W - blade) / Math.max(cols - 1, 1));
  const ease = p => p * p * (3 - 2 * p);
  const clamp = v => Math.min(Math.max(v, 0), 1);

  window.ready = (async () => {
    await document.fonts.load(`900 100px ${FONT}`);
    Foam.paintFoam(fctx, W, H, 20261018);
    letters = Foam.layoutWord(lctx, W, H, ['DIT', 'VIN', 'DUE'], FONT);
    return { lettersEnd: T_LETTERS + letters.length * (DUR + GAP), clearEnd: HOLD_END + cols * (PULL + LIFT) };
  })();

  function loadImg(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }

  window.renderAt = async (t, bgSrc) => {
    const bg = await loadImg(bgSrc);
    ctx.drawImage(bg, 0, 0, W, H);

    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, W, H);
    lctx.drawImage(fog, 0, 0);
    let sq = null;
    letters.forEach((L, i) => {
      const p = clamp((t - T_LETTERS - i * (DUR + GAP)) / DUR);
      Foam.cutLetter(lctx, L, ease(p));
      if (p > 0 && p < 1) sq = { x: L.x + L.wd / 2, y: L.top + (L.lh + L.pad) * ease(p), w: L.wd * 1.3 };
    });
    // final clear: top-to-bottom pulls, left to right
    lctx.save();
    lctx.globalCompositeOperation = 'destination-out';
    lctx.strokeStyle = '#000'; lctx.lineCap = 'round'; lctx.lineWidth = blade;
    for (let i = 0; i < cols; i++) {
      const s = HOLD_END + i * (PULL + LIFT);
      const p = clamp((t - s) / PULL);
      if (p <= 0) continue;
      const y = -blade * 0.3 + (H + blade * 0.6) * ease(p);
      lctx.beginPath(); lctx.moveTo(colX(i), -blade); lctx.lineTo(colX(i), y); lctx.stroke();
      if (p < 1) sq = { x: colX(i), y, w: blade * 1.15 };
    }
    lctx.restore();

    ctx.drawImage(layer, 0, 0);
    if (sq) Foam.drawSqueegee(ctx, sq.x, sq.y, sq.w);
  };
</script>
</body>
</html>
